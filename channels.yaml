# TikTok to YouTube Channel Pairs

channels:
  - id: channel_8
    tiktok_username: "barusamikos"
    tiktok_username_slot2: "barisamikos"
    youtube_channel_name: "barusamikos"
    # The Google account that owns this YouTube channel (supplied by the user).
    owner_email: "nm4324459@gmail.com"
    google_credentials_file: "credentials/channel_8_client_secret.json"
    oauth_token_file: "tokens/channel_8_token.json"
    videos_per_day: 2
    description_footer: ""
    default_tags:
      - barusamikos
      - japanese
      - viral
    youtube_category_id: "22"
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    # LONG VIDEOS ONLY — Shorts paused (owner, 2026-10-25; this channel only).
    #   Slot 1 = the NEWEST unposted clip from @barusamikos or @barisamikos.
    #   Slot 2 = the most-VIEWED unposted clip from either account.
    #   Both go up as Longform (4:3 blurred fill), and only clips of 1:30+ (90s).
    # A video posted once in any format is never posted again.
    upload_mode: long_split
    longform_min_seconds: 90
    # The no-empty-day repost fallback reposts as Longform too, so no Short slips in.
    repost_as_longform: true
    # How many videos to try when a download fails. The code default is 3, which is
    # too shallow: on 2026-07-31 TikTok refused three posts in a row and slot 2 lost
    # the day. Every other channel sets 15-20.
    max_download_candidates: 20
    slot_publish_times_utc:
      1: "09:00"   # PUBLIC at 6 PM JST (Long, newest)
      2: "11:00"   # PUBLIC at 8 PM JST (Long, most viewed)
